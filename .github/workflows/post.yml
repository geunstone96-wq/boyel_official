name: Instagram 자동 게시

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분마다 확인 (UTC 기준이지만, 게시 시간은 posts.json 의 한국 시간대로 판단)
  workflow_dispatch:       # Actions 탭에서 "Run workflow" 버튼으로 바로 실행 가능

permissions:
  contents: write          # 게시 결과를 posts.json 에 기록하기 위해 필요

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 예약 시간이 된 게시물 올리기
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_instagram.py

      - name: 게시 결과 기록
        run: |
          if [ -n "$(git status --porcelain posts.json)" ]; then
            git config user.name "boyel-bot"
            git config user.email "boyel-bot@users.noreply.github.com"
            git add posts.json
            git commit -m "인스타 게시 결과 기록"
            git push
          fi
